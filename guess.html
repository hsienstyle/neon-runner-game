<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💣 終極拆彈王 — 超進化猜數字</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 70%);
      padding: 16px;
      color: var(--text-main);
      overflow-x: hidden;
    }

    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    .game-container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 30px var(--primary-glow);
      position: relative;
      transition: transform 0.1s;
    }

    .shake {
      animation: shakeAnim 0.4s ease;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px) rotate(-1deg); }
      40%, 80% { transform: translateX(8px) rotate(1deg); }
    }

    /* Top Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .streak-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .sound-btn {
      background: #334155;
      color: var(--text-main);
      border: none;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }

    /* Mode & Difficulty Tabs */
    .mode-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
      background: #0f172a;
      padding: 5px;
      border-radius: 14px;
    }

    .mode-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 8px 6px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    /* Boss / Bomb Avatar Section */
    .character-stage {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .avatar-box {
      font-size: 2.8rem;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      border-radius: 16px;
      flex-shrink: 0;
      position: relative;
      animation: float 2.4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .dialogue-box {
      flex: 1;
      text-align: left;
    }

    .speaker-name {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }

    .dialogue-text {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      color: #e2e8f0;
    }

    /* Status Bar: Hearts & Timer */
    .status-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .status-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .status-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .status-val {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .timer-urgent {
      color: var(--danger);
      animation: pulse 0.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* Visual Range Bar */
    .range-visualizer {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .range-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .range-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .range-Readout {
      font-size: 1.5rem;
      font-weight: 900;
      color: #38bdf8;
    }

    .bar-track {
      width: 100%;
      height: 18px;
      background: repeating-linear-gradient(
        45deg,
        #1e293b,
        #1e293b 8px,
        #334155 8px,
        #334155 16px
      );
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }

    .bar-active {
      position: absolute;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, #06b6d4, #6366f1, #ec4899);
      border-radius: 999px;
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.8);
    }

    /* Radar / Temperature Meter */
    .radar-badge {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      background: #1e293b;
      color: var(--text-muted);
    }

    /* Power-ups Row */
    .powerups-title {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-align: left;
      font-weight: 700;
    }

    .powerups-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .item-btn {
      background: #0f172a;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 8px 6px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .item-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.12);
      transform: translateY(-2px);
    }

    .item-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .item-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Input Controls */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input[type="number"] {
      flex: 1;
      background: #0f172a;
      border: 2px solid #475569;
      color: white;
      font-size: 1.35rem;
      font-weight: 800;
      padding: 12px 16px;
      border-radius: 14px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    .guess-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 0 26px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--primary-glow);
      transition: transform 0.12s, filter 0.2s;
    }

    .guess-btn:hover:not(:disabled) {
      filter: brightness(1.12);
    }

    .guess-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .guess-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Quick Adjust Buttons */
    .quick-btns {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    .q-btn {
      background: #334155;
      color: #cbd5e1;
      border: none;
      border-radius: 8px;
      padding: 7px 0;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .q-btn:hover {
      background: #475569;
      color: white;
    }

    .q-btn.mid-btn {
      background: rgba(6, 182, 212, 0.2);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.4);
    }

    /* Restart & History */
    .restart-btn {
      width: 100%;
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 11px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 14px;
      transition: background 0.2s;
    }

    .restart-btn:hover {
      background: #475569;
    }

    .history-wrap {
      border-top: 1px solid #334155;
      padding-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 85px;
      overflow-y: auto;
    }

    .chip {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #0f172a;
      border: 1px solid #334155;
    }

    .chip.player { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
    .chip.ai { color: #f43f5e; border-color: rgba(244, 63, 94, 0.4); }
    .chip.win { background: var(--success); color: white; border: none; }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <div class="game-container" id="gameContainer">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="streak-badge" id="streakBadge">🔥 連勝：0 場 ｜ 稱號：菜鳥拆彈員</div>
      <button class="sound-btn" id="soundBtn">🔊 音效：開</button>
    </div>

    <!-- Mode Tabs -->
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="bomb">💣 限時拆彈 (1~100)</button>
      <button class="mode-btn" data-mode="vsai">🤖 決戰毒舌AI (1~200)</button>
      <button class="mode-btn" data-mode="hell">🔥 地獄密碼 (1~1000)</button>
    </div>

    <!-- Boss / Avatar & Dialogue -->
    <div class="character-stage">
      <div class="avatar-box" id="avatarBox">💣</div>
      <div class="dialogue-box">
        <div class="speaker-name">
          <span id="speakerName">定時炸彈系統</span>
          <span id="turnIndicator">你的回合</span>
        </div>
        <div class="dialogue-text" id="dialogueText">
          「滴答滴答…你有 7 條引線跟 45 秒，剪錯太多次我就炸飛你！」
        </div>
      </div>
    </div>

    <!-- Status Row -->
    <div class="status-grid">
      <div class="status-card">
        <div class="status-label">剩餘生命 (引線)</div>
        <div class="status-val" id="heartsDisplay">❤️❤️❤️❤️❤️❤️❤️</div>
      </div>
      <div class="status-card">
        <div class="status-label">倒數計時</div>
        <div class="status-val" id="timerDisplay">45s</div>
      </div>
      <div class="status-card">
        <div class="status-label">已猜次數</div>
        <div class="status-val" id="attemptsDisplay">0 次</div>
      </div>
    </div>

    <!-- Range Visualizer -->
    <div class="range-visualizer">
      <div class="range-header">
        <span class="range-title">安全密碼鎖定區間</span>
        <span class="range-Readout"><span id="minText">1</span> ~ <span id="maxText">100</span></span>
      </div>
      <div class="bar-track">
        <div class="bar-active" id="rangeBar" style="left: 0%; width: 100%;"></div>
      </div>
      <div style="text-align: center;">
        <span class="radar-badge" id="radarBadge">📡 感應雷達：等待首次探測...</span>
      </div>
    </div>

    <!-- Power-ups -->
    <div class="powerups-title">🎒 戰術道具（每局各限用 1 次）</div>
    <div class="powerups-row">
      <button class="item-btn" id="itemOddEven">
        <span>🔍 奇偶透視</span>
        <span class="item-sub">看穿單雙數</span>
      </button>
      <button class="item-btn" id="itemCutRange">
        <span>✂️ 砍半雷射</span>
        <span class="item-sub">消除一半範圍</span>
      </button>
      <button class="item-btn" id="itemHeal">
        <span>❄️ 液態氮冷凍</span>
        <span class="item-sub">+15秒 & +2命</span>
      </button>
    </div>

    <!-- Input & Quick Buttons -->
    <div class="input-row">
      <input type="number" id="guessInput" placeholder="輸入密碼..." autofocus />
      <button class="guess-btn" id="guessBtn">剪斷引線！</button>
    </div>

    <div class="quick-btns">
      <button class="q-btn" data-offset="-10">-10</button>
      <button class="q-btn" data-offset="-1">-1</button>
      <button class="q-btn mid-btn" id="midBtn">⚡ 取中間值</button>
      <button class="q-btn" data-offset="1">+1</button>
      <button class="q-btn" data-offset="10">+10</button>
    </div>

    <button class="restart-btn" id="restartBtn">🔄 換一顆炸彈（重新開始）</button>

    <div class="history-wrap" id="historyWrap">
      <span style="font-size: 0.78rem; color: #64748b;">尚無剪線紀錄...</span>
    </div>
  </div>

  <script>
    // ====== Web Audio Synthesizer (Zero external assets) ======
    let soundEnabled = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type = "sine", duration = 0.12, vol = 0.15) {
      if (!soundEnabled) return;
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playSound(effect, proximityRatio = 0.5) {
      if (!soundEnabled) return;
      if (effect === "guess") {
        // Higher pitch the closer you are!
        const baseFreq = 260 + Math.floor((1 - proximityRatio) * 520);
        playTone(baseFreq, "triangle", 0.15, 0.2);
      } else if (effect === "powerup") {
        playTone(523.25, "sine", 0.1, 0.18);
        setTimeout(() => playTone(659.25, "sine", 0.12, 0.18), 90);
        setTimeout(() => playTone(783.99, "sine", 0.18, 0.18), 180);
      } else if (effect === "win") {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
          setTimeout(() => playTone(f, "triangle", 0.22, 0.22), idx * 110);
        });
      } else if (effect === "boom") {
        playTone(110, "sawtooth", 0.45, 0.3);
        setTimeout(() => playTone(75, "square", 0.5, 0.3), 100);
      } else if (effect === "tick") {
        playTone(800, "sine", 0.04, 0.06);
      }
    }

    // ====== Game State ======
    const MODES = {
      bomb: { max: 100, lives: 7, time: 45, name: "定時炸彈系統", avatar: "💣" },
      vsai: { max: 200, lives: 99, time: 60, name: "毒舌機器人 RX-78", avatar: "🤖" },
      hell: { max: 1000, lives: 10, time: 60, name: "地獄魔王核彈", avatar: "😈" }
    };

    let currentMode = "bomb";
    let totalMax = 100;
    let minRange = 1;
    let maxRange = 100;
    let secret = 50;
    let lives = 7;
    let maxLives = 7;
    let timeLeft = 45;
    let timerId = null;
    let attempts = 0;
    let streak = Number(localStorage.getItem("bombGuessStreak") || 0);
    let isGameOver = false;
    let isAiTurn = false;
    let history = [];

    // DOM Elements
    const gameContainer = document.getElementById("gameContainer");
    const streakBadge = document.getElementById("streakBadge");
    const soundBtn = document.getElementById("soundBtn");
    const avatarBox = document.getElementById("avatarBox");
    const speakerName = document.getElementById("speakerName");
    const turnIndicator = document.getElementById("turnIndicator");
    const dialogueText = document.getElementById("dialogueText");
    const heartsDisplay = document.getElementById("heartsDisplay");
    const timerDisplay = document.getElementById("timerDisplay");
    const attemptsDisplay = document.getElementById("attemptsDisplay");
    const minText = document.getElementById("minText");
    const maxText = document.getElementById("maxText");
    const rangeBar = document.getElementById("rangeBar");
    const radarBadge = document.getElementById("radarBadge");
    const guessInput = document.getElementById("guessInput");
    const guessBtn = document.getElementById("guessBtn");
    const midBtn = document.getElementById("midBtn");
    const restartBtn = document.getElementById("restartBtn");
    const historyWrap = document.getElementById("historyWrap");

    const itemOddEven = document.getElementById("itemOddEven");
    const itemCutRange = document.getElementById("itemCutRange");
    const itemHeal = document.getElementById("itemHeal");

    const TAUNTS_HIGH = [
      "「太高啦！你想把天花板炸穿嗎？」",
      "「數字太大了！往小一點猜好嗎？」",
      "「高得離譜！我連引線都在偷笑～」"
    ];
    const TAUNTS_LOW = [
      "「太小囉！膽子這麼小怎麼拆彈？」",
      "「太低啦！再往上加一點！」",
      "「不夠高！差得遠呢，快點時間不多了！」"
    ];

    function getTitleByStreak(s) {
      if (s >= 10) return "👑 傳說通靈王";
      if (s >= 5) return "🎖️ 皇家拆彈專家";
      if (s >= 3) return "⚡ 讀心術大師";
      if (s >= 1) return "🔧 熟練拆彈員";
      return "🐣 菜鳥拆彈員";
    }

    function updateStreakUI() {
      streakBadge.textContent = `🔥 連勝：${streak} 場 ｜ 稱號：${getTitleByStreak(streak)}`;
    }

    function updateRangeUI() {
      minText.textContent = minRange;
      maxText.textContent = maxRange;
      const leftPct = ((minRange - 1) / totalMax) * 100;
      const widthPct = Math.max(((maxRange - minRange + 1) / totalMax) * 100, 2);
      rangeBar.style.left = `${leftPct}%`;
      rangeBar.style.width = `${widthPct}%`;
    }

    function updateHeartsUI() {
      if (currentMode === "vsai") {
        heartsDisplay.textContent = "♾️ 對決模式";
        return;
      }
      heartsDisplay.textContent = "❤️".repeat(Math.max(0, lives)) + "🖤".repeat(Math.max(0, maxLives - lives));
    }

    function triggerShake() {
      gameContainer.classList.remove("shake");
      void gameContainer.offsetWidth;
      gameContainer.classList.add("shake");
    }

    function initGame() {
      clearInterval(timerId);
      const cfg = MODES[currentMode];
      totalMax = cfg.max;
      minRange = 1;
      maxRange = cfg.max;
      secret = Math.floor(Math.random() * totalMax) + 1;
      lives = cfg.lives;
      maxLives = cfg.lives;
      timeLeft = cfg.time;
      attempts = 0;
      isGameOver = false;
      isAiTurn = false;
      history = [];

      avatarBox.textContent = cfg.avatar;
      speakerName.textContent = cfg.name;
      turnIndicator.textContent = "🟢 你的回合";
      if (currentMode === "vsai") {
        dialogueText.textContent = "「人類，我們輪流猜 1~200，誰先猜中密碼誰就贏！你先請吧～」";
      } else {
        dialogueText.textContent = `「密碼藏在 1 ~ ${totalMax} 之間，你有 ${lives} 次機會與 ${timeLeft} 秒！」`;
      }

      updateStreakUI();
      updateHeartsUI();
      updateRangeUI();
      attemptsDisplay.textContent = `0 次`;
      timerDisplay.textContent = `${timeLeft}s`;
      timerDisplay.classList.remove("timer-urgent");
      radarBadge.textContent = "📡 感應雷達：等待首次探測...";
      radarBadge.style.background = "#1e293b";
      radarBadge.style.color = "#94a3b8";

      itemOddEven.disabled = false;
      itemCutRange.disabled = false;
      itemHeal.disabled = false;

      guessInput.disabled = false;
      guessBtn.disabled = false;
      guessInput.value = "";
      guessInput.focus();
      renderHistory();

      timerId = setInterval(() => {
        if (isGameOver) return;
        timeLeft--;
        timerDisplay.textContent = `${timeLeft}s`;
        if (timeLeft <= 10) {
          timerDisplay.classList.add("timer-urgent");
          playSound("tick");
        }
        if (timeLeft <= 0) {
          endGame(false, `⏰ 時間到！炸彈引爆了！正確密碼是 ${secret}`);
        }
      }, 1000);
    }

    function updateRadar(guess) {
      const diff = Math.abs(secret - guess);
      const ratio = diff / totalMax;
      if (diff === 0) {
        radarBadge.textContent = "🎯 完美命中核心！！";
        radarBadge.style.background = "#065f46";
        radarBadge.style.color = "#6ee7b7";
      } else if (diff <= 3 || ratio <= 0.02) {
        radarBadge.textContent = `🔥 極度滾燙！（誤差不到 ${Math.max(3, Math.ceil(totalMax * 0.02))}！）`;
        radarBadge.style.background = "#7f1d1d";
        radarBadge.style.color = "#fca5a5";
      } else if (ratio <= 0.08) {
        radarBadge.textContent = "♨️ 非常接近！雷達強烈反應中！";
        radarBadge.style.background = "#78350f";
        radarBadge.style.color = "#fcd34d";
      } else if (ratio <= 0.22) {
        radarBadge.textContent = "🌡️ 微溫感應，正在縮小距離";
        radarBadge.style.background = "#1e3a8a";
        radarBadge.style.color = "#93c5fd";
      } else {
        radarBadge.textContent = "❄️ 冰天雪地！離目標還很遠";
        radarBadge.style.background = "#0f172a";
        radarBadge.style.color = "#64748b";
      }
      return ratio;
    }

    function renderHistory() {
      if (history.length === 0) {
        historyWrap.innerHTML = '<span style="font-size: 0.78rem; color: #64748b;">尚無剪線紀錄...</span>';
        return;
      }
      historyWrap.innerHTML = history
        .map((h) => `<span class="chip ${h.type}">${h.label}</span>`)
        .join("");
      historyWrap.scrollTop = historyWrap.scrollHeight;
    }

    function endGame(playerWon, message) {
      isGameOver = true;
      clearInterval(timerId);
      guessInput.disabled = true;
      guessBtn.disabled = true;
      itemOddEven.disabled = true;
      itemCutRange.disabled = true;
      itemHeal.disabled = true;

      dialogueText.textContent = message;

      if (playerWon) {
        avatarBox.textContent = "🎉";
        turnIndicator.textContent = "🏆 拆彈成功";
        streak++;
        localStorage.setItem("bombGuessStreak", streak);
        updateStreakUI();
        playSound("win");
        launchConfetti();
      } else {
        avatarBox.textContent = "💥";
        turnIndicator.textContent = "💀 任務失敗";
        streak = 0;
        localStorage.setItem("bombGuessStreak", 0);
        updateStreakUI();
        playSound("boom");
        triggerShake();
      }
    }

    function processGuess(guess, byAi = false) {
      if (isGameOver) return;

      const ratio = updateRadar(guess);
      playSound("guess", ratio);

      if (!byAi) {
        attempts++;
        attemptsDisplay.textContent = `${attempts} 次`;
      }

      if (guess === secret) {
        history.push({ type: "win", label: `${byAi ? "🤖 AI" : "🧑‍💻 你"}: 🎯 ${guess}` });
        renderHistory();
        if (byAi) {
          endGame(false, `🤖 「哈哈！密碼是 ${secret}，被我先猜中啦！人類不過如此～」`);
        } else {
          endGame(true, `🎉 「不可思議！你只花 ${attempts} 次就拆除了密碼 ${secret}！」`);
        }
        return;
      }

      // Narrow range
      if (guess > secret) {
        maxRange = guess - 1;
        history.push({ type: byAi ? "ai" : "player", label: `${byAi ? "🤖" : "你"} ${guess} ↓` });
        if (!byAi) {
          dialogueText.textContent = TAUNTS_HIGH[Math.floor(Math.random() * TAUNTS_HIGH.length)];
        }
      } else {
        minRange = guess + 1;
        history.push({ type: byAi ? "ai" : "player", label: `${byAi ? "🤖" : "你"} ${guess} ↑` });
        if (!byAi) {
          dialogueText.textContent = TAUNTS_LOW[Math.floor(Math.random() * TAUNTS_LOW.length)];
        }
      }

      updateRangeUI();
      renderHistory();

      // Check lives in non-AI mode
      if (!byAi && currentMode !== "vsai") {
        lives--;
        updateHeartsUI();
        triggerShake();
        if (lives <= 0) {
          endGame(false, `💥 引線全部剪錯！炸彈爆炸啦！正確密碼是 ${secret}`);
          return;
        }
      }

      // If only 1 number left, warn excitement!
      if (minRange === maxRange) {
        radarBadge.textContent = `🚨 密碼已經完全鎖定：就是 ${minRange}！`;
      }

      // Handle VS AI Turn
      if (currentMode === "vsai" && !byAi && !isGameOver) {
        isAiTurn = true;
        guessInput.disabled = true;
        guessBtn.disabled = true;
        turnIndicator.textContent = "🤖 AI 思考中...";
        setTimeout(() => {
          if (isGameOver) return;
          // Smart AI with slight randomness so player has a chance
          const mid = Math.floor((minRange + maxRange) / 2);
          const jitter = Math.floor((Math.random() - 0.5) * Math.min(8, maxRange - minRange));
          const aiGuess = Math.min(maxRange, Math.max(minRange, mid + jitter));
          dialogueText.textContent = `🤖 「本機器人推算密碼是 ${aiGuess}！看招！」`;
          processGuess(aiGuess, true);

          if (!isGameOver) {
            isAiTurn = false;
            guessInput.disabled = false;
            guessBtn.disabled = false;
            turnIndicator.textContent = "🟢 你的回合";
            guessInput.focus();
          }
        }, 900);
      }
    }

    function handlePlayerSubmit() {
      if (isGameOver || isAiTurn) return;
      const val = Number(guessInput.value.trim());
      if (!guessInput.value.trim() || isNaN(val) || !Number.isInteger(val)) {
        dialogueText.textContent = "⚠️ 「請輸入有效的整數密碼！」";
        triggerShake();
        return;
      }
      if (val < minRange || val > maxRange) {
        dialogueText.textContent = `⚠️ 「喂！目前範圍已經縮小到 ${minRange} ~ ${maxRange} 了，別浪費機會！」`;
        triggerShake();
        guessInput.value = "";
        guessInput.focus();
        return;
      }
      guessInput.value = "";
      processGuess(val, false);
      guessInput.focus();
    }

    // ====== Tactical Power-ups ======
    itemOddEven.addEventListener("click", () => {
      if (isGameOver || isAiTurn) return;
      playSound("powerup");
      itemOddEven.disabled = true;
      const parity = secret % 2 === 0 ? "【偶數（雙數）】" : "【奇數（單數）】";
      dialogueText.textContent = `🔍 透視成功！這顆炸彈的密碼絕對是 ${parity}！`;
    });

    itemCutRange.addEventListener("click", () => {
      if (isGameOver || isAiTurn) return;
      if (maxRange - minRange <= 2) {
        dialogueText.textContent = "⚠️ 範圍已經夠小了，不需要使用砍半雷射！";
        return;
      }
      playSound("powerup");
      itemCutRange.disabled = true;
      const mid = Math.floor((minRange + maxRange) / 2);
      if (secret <= mid) {
        maxRange = mid;
      } else {
        minRange = mid + 1;
      }
      updateRangeUI();
      dialogueText.textContent = `✂️ 雷射發射！已幫你消除一半的假範圍，鎖定 ${minRange} ~ ${maxRange}！`;
      guessInput.focus();
    });

    itemHeal.addEventListener("click", () => {
      if (isGameOver || isAiTurn) return;
      playSound("powerup");
      itemHeal.disabled = true;
      timeLeft += 15;
      timerDisplay.textContent = `${timeLeft}s`;
      timerDisplay.classList.remove("timer-urgent");
      if (currentMode !== "vsai") {
        lives = Math.min(maxLives, lives + 2);
        updateHeartsUI();
      }
      dialogueText.textContent = "❄️ 液態氮注入！倒數計時 +15 秒，引線生命恢復 +2！";
      guessInput.focus();
    });

    // ====== Quick Adjust & Mode Listeners ======
    midBtn.addEventListener("click", () => {
      if (isGameOver || isAiTurn) return;
      guessInput.value = Math.floor((minRange + maxRange) / 2);
      guessInput.focus();
    });

    document.querySelectorAll(".q-btn[data-offset]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (isGameOver || isAiTurn) return;
        const offset = Number(btn.dataset.offset);
        const base = Number(guessInput.value) || Math.floor((minRange + maxRange) / 2);
        const clamped = Math.min(maxRange, Math.max(minRange, base + offset));
        guessInput.value = clamped;
        guessInput.focus();
      });
    });

    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        initGame();
      });
    });

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊 音效：開" : "🔇 音效：關";
    });

    guessBtn.addEventListener("click", handlePlayerSubmit);
    guessInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handlePlayerSubmit();
    });
    restartBtn.addEventListener("click", initGame);

    // ====== Confetti Celebration Effect ======
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function launchConfetti() {
      particles = [];
      const colors = ["#6366f1", "#ec4899", "#f59e0b", "#10b981", "#06b6d4"];
      for (let i = 0; i < 110; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 18,
          vy: (Math.random() - 0.8) * 18,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1
        });
      }
      requestAnimationFrame(stepConfetti);
    }

    function stepConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.38; // gravity
        p.alpha -= 0.012;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
      particles = particles.filter((p) => p.alpha > 0);
      if (particles.length > 0) {
        requestAnimationFrame(stepConfetti);
      }
    }

    initGame();
  </script>
</body>
</html>
