<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>⚡ 霓虹酷跑王 — 手機觸控 & 電腦雙棲版</title>
  <style>
    :root {
      --bg: #070b14;
      --glass: rgba(15, 23, 42, 0.62);
      --glass-border: rgba(148, 163, 184, 0.18);
      --cyan: #22d3ee;
      --violet: #a78bfa;
      --pink: #f472b6;
      --amber: #fbbf24;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(99, 102, 241, 0.25), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(236, 72, 153, 0.18), transparent 60%),
        var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-wrapper {
      width: 100%;
      max-width: 960px;
      height: 100dvh;
      max-height: 700px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      position: relative;
    }

    @media (max-width: 768px) {
      .app-wrapper { max-height: 100dvh; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
    }

    /* ===== Stage ===== */
    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: linear-gradient(180deg, #0b1124 0%, #0d1330 100%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    canvas {
      display: block;
      border-radius: 16px;
      box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.18), 0 10px 40px rgba(34, 211, 238, 0.12);
    }

    /* ===== Floating HUD ===== */
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .hud-left {
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 6px 12px 8px;
    }

    .hud-score {
      font-size: 1.7rem;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #67e8f9, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
    }

    .hud-score small {
      font-size: 0.85rem;
      margin-left: 2px;
      -webkit-text-fill-color: var(--muted);
    }

    .hud-sub { display: flex; gap: 6px; margin-top: 3px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      font-variant-numeric: tabular-nums;
    }

    .chip.best { color: #c4b5fd; }
    .chip.balls { color: #fecaca; }

    .mini-ball {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ef4444 0 45%, #0f172a 45% 55%, #f8fafc 55% 100%);
      box-shadow: 0 0 0 1px #0f172a;
      display: inline-block;
    }

    .hud-actions { display: flex; gap: 6px; pointer-events: auto; }

    .round-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .round-btn:hover { background: rgba(51, 65, 85, 0.8); }
    .round-btn:active { transform: scale(0.9); }

    .buff-bar {
      position: absolute;
      top: 86px;
      left: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
    }

    .buff-tag {
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(34, 211, 238, 0.5);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
      color: #fff;
      animation: buffIn 0.25s ease;
    }

    @keyframes buffIn { from { transform: translateY(-6px); opacity: 0; } }

    .toast {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      font-size: clamp(1.3rem, 5vw, 2rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 18px rgba(34, 211, 238, 0.9), 0 2px 0 #0f172a;
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      white-space: nowrap;
      transition: opacity 0.25s, transform 0.25s;
    }

    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .gesture-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass);
      backdrop-filter: blur(8px);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.6s;
      z-index: 9;
    }

    .gesture-hint.fade { opacity: 0; }

    /* ===== Overlays ===== */
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(30, 27, 75, 0.82), rgba(7, 11, 20, 0.92));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 20;
      overflow-y: auto;
      animation: fadeIn 0.25s ease;
    }

    .overlay.hidden { display: none; }

    @keyframes fadeIn { from { opacity: 0; } }

    .menu-card {
      width: 100%;
      max-width: 520px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: auto;
      animation: popIn 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
    }

    .menu-card.small { max-width: 320px; gap: 12px; }

    @keyframes popIn { from { transform: scale(0.92); opacity: 0; } }

    .menu-logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 1.8rem;
      background: linear-gradient(135deg, #facc15, #f97316);
      box-shadow: 0 8px 30px rgba(250, 204, 21, 0.45);
      animation: bob 2.2s ease-in-out infinite;
    }

    @keyframes bob { 50% { transform: translateY(-5px) rotate(-4deg); } }

    .game-title {
      font-size: clamp(1.45rem, 5.2vw, 2.1rem);
      font-weight: 900;
      line-height: 1.15;
      background: linear-gradient(90deg, #67e8f9, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .game-title span { font-size: 0.62em; letter-spacing: 2px; }

    .game-sub {
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.45;
      max-width: 440px;
    }

    .section-label {
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--muted);
      margin-top: 4px;
    }

    .card-row, .skin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
    }

    .skin-card {
      background: rgba(30, 41, 59, 0.7);
      border: 2px solid rgba(71, 85, 105, 0.6);
      border-radius: 16px;
      padding: 8px 4px 7px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .skin-card:hover { transform: translateY(-2px); }
    .skin-card:active { transform: scale(0.96); }

    .skin-card.selected {
      border-color: var(--cyan);
      background: linear-gradient(180deg, rgba(34, 211, 238, 0.18), rgba(30, 41, 59, 0.75));
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
    }

    .skin-card.selected::after {
      content: "✓";
      position: absolute;
      top: -7px;
      right: -7px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--cyan);
      color: #0f172a;
      font-size: 0.75rem;
      font-weight: 900;
      display: grid;
      place-items: center;
    }

    .skin-avatar-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 46px;
      margin-bottom: 4px;
    }

    .skin-thumb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      object-fit: cover;
      background: #0f172a;
    }

    .skin-thumb.duo-thumb { width: 34px; height: 34px; margin: 0 -5px; }

    .skin-name { font-size: 0.72rem; font-weight: 800; color: #f8fafc; line-height: 1.2; }
    .skin-cost { font-size: 0.62rem; color: #7dd3fc; font-weight: 700; margin-top: 2px; }

    .start-btn {
      margin-top: 6px;
      width: 100%;
      max-width: 300px;
      background: linear-gradient(135deg, #22d3ee, #6366f1 55%, #ec4899);
      background-size: 200% 200%;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5);
      animation: shimmer 3s ease infinite;
      transition: transform 0.12s;
    }

    .start-btn:active { transform: scale(0.96); }

    @keyframes shimmer { 50% { background-position: 100% 50%; } }

    .ghost-btn {
      width: 100%;
      max-width: 300px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }

    .key-hint { font-size: 0.68rem; color: #64748b; font-weight: 600; }

    @media (max-width: 768px) { .key-hint { display: none; } }

    /* Game over stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin: 4px 0;
    }

    .stat-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 8px 4px;
    }

    .stat-box b {
      display: block;
      font-size: 1.25rem;
      font-weight: 900;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .stat-box span { font-size: 0.68rem; color: var(--muted); font-weight: 700; }

    .new-record {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #facc15, #f97316);
      color: #1f2937;
      font-weight: 900;
      font-size: 0.8rem;
      animation: bob 1.2s ease-in-out infinite;
    }

    /* ===== Controls ===== */
    .controls-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1.5fr;
      gap: 10px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      position: relative;
      height: 72px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      background: rgba(30, 41, 59, 0.75);
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      overflow: hidden;
      transition: transform 0.08s, filter 0.1s;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .ctrl-btn:active { transform: scale(0.94); filter: brightness(1.3); }

    .ctrl-icon { font-size: 1.5rem; font-weight: 900; line-height: 1; position: relative; z-index: 1; }
    .ctrl-label { font-size: 0.74rem; font-weight: 800; color: #cbd5e1; position: relative; z-index: 1; }

    .ctrl-btn.slide { border-color: rgba(251, 191, 36, 0.45); background: linear-gradient(180deg, rgba(251, 191, 36, 0.18), rgba(30, 41, 59, 0.8)); }
    .ctrl-btn.slide .ctrl-icon { color: var(--amber); }

    .ctrl-btn.dash { border-color: rgba(244, 114, 182, 0.45); background: linear-gradient(180deg, rgba(244, 114, 182, 0.18), rgba(30, 41, 59, 0.8)); }
    .ctrl-btn.dash .ctrl-icon { color: var(--pink); }

    /* Dash cooldown fill */
    .ctrl-btn.dash::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: calc(var(--cd, 0) * 100%);
      background: rgba(15, 23, 42, 0.7);
      transition: height 0.1s linear;
    }

    .ctrl-btn.jump {
      border-color: rgba(34, 211, 238, 0.6);
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.35), rgba(99, 102, 241, 0.35));
      box-shadow: 0 6px 22px rgba(34, 211, 238, 0.25);
    }

    .ctrl-btn.jump .ctrl-icon { font-size: 1.8rem; color: #a5f3fc; }

    @media (min-width: 769px) {
      .ctrl-btn { height: 58px; flex-direction: row; gap: 8px; }
      .ctrl-icon { font-size: 1.2rem; }
      .ctrl-btn.jump .ctrl-icon { font-size: 1.3rem; }
      .ctrl-label { font-size: 0.85rem; }
    }

    /* QR */
    .qr-box { background: white; padding: 10px; border-radius: 16px; display: inline-block; }

    .url-badge {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #38bdf8;
      color: #7dd3fc;
      padding: 7px 14px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.85rem;
      font-weight: 700;
      word-break: break-all;
      user-select: text;
      -webkit-user-select: text;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <!-- Game Stage -->
    <div class="canvas-wrap" id="touchZone">
      <canvas id="gameCanvas" width="860" height="460"></canvas>

      <!-- Floating HUD -->
      <div class="hud">
        <div class="hud-left">
          <div class="hud-score"><span id="scoreText">0</span><small>m</small></div>
          <div class="hud-sub">
            <span class="chip best">🏆 <span id="bestText">0</span>m</span>
            <span class="chip balls"><i class="mini-ball"></i><span id="coinsText">0</span></span>
          </div>
        </div>
        <div class="hud-actions">
          <button class="round-btn" id="qrOpenBtn" title="手機掃碼玩">📱</button>
          <button class="round-btn" id="soundBtn" title="音效">🔊</button>
          <button class="round-btn" id="pauseBtn" title="暫停 (P)">⏸️</button>
        </div>
      </div>
      <div class="buff-bar" id="buffBar"></div>
      <div class="toast" id="toast"></div>
      <div class="gesture-hint" id="gestureHint">👆 點畫面跳躍 · 👇 下滑蹲下 · 👉 右滑衝刺</div>

      <!-- Main Menu / Game Over -->
      <div class="overlay" id="menuOverlay">
        <div class="menu-card">
          <div class="menu-logo">⚡</div>
          <div class="game-title" id="overlayTitle">Alfie &amp; Darren<br /><span>寶可夢單車酷跑</span></div>
          <div class="game-sub" id="overlayDesc">選擇小騎士與夥伴，沿途收集精靈球、閃避障礙，看誰騎得最遠！</div>

          <div class="section-label">🚴 選擇小騎士</div>
          <div class="card-row" id="skinGrid"></div>

          <div class="section-label">✨ 選擇寶可夢風格夥伴</div>
          <div class="card-row" id="pokeGrid"></div>

          <button class="start-btn" id="startBtn">▶ 開始騎車</button>
          <div class="key-hint">電腦：空白鍵 跳躍 · ↓ 蹲下 · Shift 衝刺 · P 暫停</div>
        </div>
      </div>

      <!-- Pause -->
      <div class="overlay hidden" id="pauseOverlay">
        <div class="menu-card small">
          <div class="game-title">⏸ 暫停中</div>
          <button class="start-btn" id="resumeBtn">▶ 繼續騎車</button>
          <button class="ghost-btn" id="quitBtn">🏠 回主選單</button>
        </div>
      </div>

      <!-- QR Code -->
      <div class="overlay hidden" id="qrOverlay">
        <div class="menu-card small">
          <div class="game-title">📱 手機掃碼玩</div>
          <div class="game-sub">4G / 5G / Wi-Fi 都能玩，用相機掃描：</div>
          <div class="qr-box">
            <img
              id="qrImg"
              alt="QR Code"
              width="180"
              height="180"
              src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://hsienstyle.github.io/neon-runner-game/"
            />
          </div>
          <div class="url-badge" id="lanUrlText">https://hsienstyle.github.io/neon-runner-game/</div>
          <div class="game-sub" style="font-size: 0.74rem;">💡 打開後選「加入主畫面」就像 APP 一樣！</div>
          <button class="start-btn" id="qrCloseBtn">返回遊戲</button>
        </div>
      </div>
    </div>

    <!-- Thumb Controls -->
    <div class="controls-bar">
      <button class="ctrl-btn slide" id="btnSlide">
        <span class="ctrl-icon">⬇</span><span class="ctrl-label">蹲下</span>
      </button>
      <button class="ctrl-btn dash" id="btnDash">
        <span class="ctrl-icon">⚡</span><span class="ctrl-label">衝刺</span>
      </button>
      <button class="ctrl-btn jump" id="btnJump">
        <span class="ctrl-icon">⬆</span><span class="ctrl-label">跳躍（可二段）</span>
      </button>
    </div>
  </div>

  <script>
    // ====== Web Audio Synthesizer ======
    let soundOn = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type = "sine", dur = 0.12, vol = 0.15, slideFreq = null) {
      if (!soundOn) return;
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideFreq) {
        osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + dur);
      }
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    function sfx(name) {
      if (!soundOn) return;
      if (name === "jump") playTone(320, "triangle", 0.14, 0.18, 620);
      else if (name === "doubleJump") playTone(480, "sine", 0.16, 0.2, 880);
      else if (name === "dash") playTone(180, "sawtooth", 0.18, 0.2, 600);
      else if (name === "coin") {
        playTone(987.77, "sine", 0.08, 0.15);
        setTimeout(() => playTone(1318.5, "sine", 0.12, 0.15), 60);
      } else if (name === "powerup") {
        [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, "triangle", 0.12, 0.18), i * 65));
      } else if (name === "shieldBreak") {
        playTone(300, "square", 0.25, 0.25, 90);
      } else if (name === "hit") {
        playTone(140, "sawtooth", 0.4, 0.3, 45);
      }
    }

    // ====== Hero Photos & Skins ======
    const imgHero1 = new Image();
    imgHero1.src = "hero1.jpg";
    const imgHero2 = new Image();
    imgHero2.src = "hero2.jpg";

    const SKINS = [
      { id: "duo", name: "Alfie & Darren", color: "#38bdf8", badge: "👬 雙人戰隊" },
      { id: "hero1", name: "Alfie (紅車)", color: "#ef4444", badge: "🔴 紅色戰車" },
      { id: "hero2", name: "Darren (綠車)", color: "#10b981", badge: "🟢 綠色戰車" },
      { id: "photo", name: "寫真原圖模式", color: "#f59e0b", badge: "📸 全身寫真" }
    ];

    const POKE_PARTNERS = [
      { id: "pika", name: "閃電皮卡", color: "#facc15", move: "⚡ 十萬伏特", icon: "⚡🐭" },
      { id: "dragon", name: "噴火飛龍", color: "#f97316", move: "🔥 噴射火焰", icon: "🔥🐲" },
      { id: "frog", name: "甲賀水蛙", color: "#06b6d4", move: "💧 飛水手裏劍", icon: "💧🐸" },
      { id: "mew", name: "超夢幻神獸", color: "#e879f9", move: "🌟 精神強念", icon: "✨🔮" }
    ];

    let totalCoins = Number(localStorage.getItem("neonRunnerCoins") || 0);
    let bestScore = Number(localStorage.getItem("neonRunnerBest") || 0);
    let currentSkinId = localStorage.getItem("neonRunnerHeroMode") || "duo";
    let currentPokeId = localStorage.getItem("neonRunnerPokePartner") || "pika";

    const scoreText = document.getElementById("scoreText");
    const bestText = document.getElementById("bestText");
    const coinsText = document.getElementById("coinsText");
    const menuOverlay = document.getElementById("menuOverlay");
    const qrOverlay = document.getElementById("qrOverlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayDesc = document.getElementById("overlayDesc");
    const skinGrid = document.getElementById("skinGrid");
    const pokeGrid = document.getElementById("pokeGrid");
    const startBtn = document.getElementById("startBtn");
    const buffBar = document.getElementById("buffBar");
    const pauseBtn = document.getElementById("pauseBtn");
    const soundBtn = document.getElementById("soundBtn");
    const qrOpenBtn = document.getElementById("qrOpenBtn");
    const qrCloseBtn = document.getElementById("qrCloseBtn");

    function updateHUD() {
      bestText.textContent = Math.floor(bestScore);
      coinsText.textContent = totalCoins;
    }

    function getPokePartner() {
      return POKE_PARTNERS.find((p) => p.id === currentPokeId) || POKE_PARTNERS[0];
    }

    function renderSkinShop() {
      skinGrid.innerHTML = "";
      SKINS.forEach((s) => {
        const isSelected = currentSkinId === s.id;
        const card = document.createElement("div");
        card.className = `skin-card ${isSelected ? "selected" : ""}`;

        let avatarHTML = "";
        if (s.id === "duo" || s.id === "photo") {
          avatarHTML = `
            <div class="skin-avatar-wrap">
              <img class="skin-thumb duo-thumb" src="hero1.jpg" style="object-position: 49% 25%; border-color:#ef4444;" />
              <img class="skin-thumb duo-thumb" src="hero2.jpg" style="object-position: 51% 15%; border-color:#10b981;" />
            </div>
          `;
        } else if (s.id === "hero1") {
          avatarHTML = `
            <div class="skin-avatar-wrap">
              <img class="skin-thumb" src="hero1.jpg" style="object-position: 49% 25%; border-color:#ef4444;" />
            </div>
          `;
        } else {
          avatarHTML = `
            <div class="skin-avatar-wrap">
              <img class="skin-thumb" src="hero2.jpg" style="object-position: 51% 15%; border-color:#10b981;" />
            </div>
          `;
        }

        card.innerHTML = `
          ${avatarHTML}
          <div class="skin-name">${s.name}</div>
          <div class="skin-cost">${isSelected ? "✅ 出戰中" : s.badge}</div>
        `;
        card.addEventListener("click", () => {
          currentSkinId = s.id;
          localStorage.setItem("neonRunnerHeroMode", currentSkinId);
          sfx("coin");
          renderSkinShop();
        });
        skinGrid.appendChild(card);
      });

      if (pokeGrid) {
        pokeGrid.innerHTML = "";
        POKE_PARTNERS.forEach((p) => {
          const isSelected = currentPokeId === p.id;
          const card = document.createElement("div");
          card.className = `skin-card ${isSelected ? "selected" : ""}`;
          card.style.borderColor = isSelected ? p.color : "#334155";
          card.innerHTML = `
            <div style="font-size:1.5rem;margin-bottom:3px;">${p.icon}</div>
            <div class="skin-name" style="color:${p.color};">${p.name}</div>
            <div class="skin-cost" style="color:#fde047;">${isSelected ? `✅ ${p.move}` : p.move}</div>
          `;
          card.addEventListener("click", () => {
            currentPokeId = p.id;
            localStorage.setItem("neonRunnerPokePartner", currentPokeId);
            sfx("powerup");
            renderSkinShop();
          });
          pokeGrid.appendChild(card);
        });
      }
    }

    // ====== Game Engine ======
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const GROUND_Y = 390;

    let isRunning = false;
    let isPaused = false;
    let distance = 0;
    let speed = 6.5;
    let frameCount = 0;
    let shakeFrames = 0;
    let startCountdown = 0;
    let popups = [];
    let nextMilestone = 250;
    let ballsThisRun = 0;
    const toastEl = document.getElementById("toast");
    const gestureHint = document.getElementById("gestureHint");
    const pauseOverlay = document.getElementById("pauseOverlay");
    const stars = Array.from({ length: 70 }, () => ({
      x: Math.random() * 1100,
      y: Math.random() * 260,
      r: Math.random() * 1.4 + 0.3,
      tw: Math.random() * Math.PI * 2
    }));

    const player = {
      x: 64,
      y: GROUND_Y - 52,
      w: 46,
      h: 52,
      vy: 0,
      gravity: 0.72,
      jumpCount: 0,
      maxJumps: 2,
      isSliding: false,
      dashTimer: 0,
      dashCooldown: 0,
      shield: false,
      magnetTimer: 0,
      jetpackTimer: 0
    };

    // Keep a playable wide view on every screen; letterbox inside the stage on portrait phones
    function syncCanvasAspect() {
      const wrap = canvas.parentElement.getBoundingClientRect();
      if (!wrap.width || !wrap.height) return;
      const logicalW = Math.round(Math.min(1100, Math.max(640, 460 * (wrap.width / wrap.height))));
      canvas.width = logicalW;
      canvas.height = 460;
      let cssW = wrap.width;
      let cssH = (wrap.width * 460) / logicalW;
      if (cssH > wrap.height) {
        cssH = wrap.height;
        cssW = (cssH * logicalW) / 460;
      }
      canvas.style.width = `${Math.floor(cssW)}px`;
      canvas.style.height = `${Math.floor(cssH)}px`;
      player.x = Math.min(130, Math.max(90, Math.round(logicalW * 0.16)));
    }
    window.addEventListener("resize", syncCanvasAspect);
    window.addEventListener("orientationchange", () => setTimeout(syncCanvasAspect, 150));
    setTimeout(syncCanvasAspect, 0);

    let obstacles = [];
    let platforms = [];
    let coins = [];
    let powerups = [];
    let particles = [];
    let bgBuildings = [];

    for (let i = 0; i < 18; i++) {
      bgBuildings.push({
        x: i * 65,
        w: 45 + Math.random() * 35,
        h: 90 + Math.random() * 170,
        layer: i % 2 === 0 ? 1 : 2
      });
    }

    function getSkin() {
      return SKINS.find((s) => s.id === currentSkinId) || SKINS[0];
    }

    function spawnParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 8 - 2,
          vy: (Math.random() - 0.5) * 8,
          size: Math.random() * 5 + 3,
          color,
          alpha: 1
        });
      }
    }

    function resetGame() {
      syncCanvasAspect();
      distance = 0;
      speed = 6.5;
      frameCount = 0;
      shakeFrames = 0;

      player.y = GROUND_Y - 52;
      player.h = 52;
      player.vy = 0;
      player.jumpCount = 0;
      player.isSliding = false;
      player.dashTimer = 0;
      player.dashCooldown = 0;
      player.shield = false;
      player.magnetTimer = 0;
      player.jetpackTimer = 0;

      obstacles = [];
      platforms = [];
      coins = [];
      powerups = [];
      particles = [];
      popups = [];
      nextMilestone = 250;
      ballsThisRun = 0;
      startCountdown = 200; // 3-2-1 GO!
      lastBuffHTML = "";
      buffBar.innerHTML = "";
      btnDash.style.setProperty("--cd", 0);
      isRunning = true;
      isPaused = false;
      pauseBtn.textContent = "⏸️";
      menuOverlay.classList.add("hidden");
      pauseOverlay.classList.add("hidden");
      qrOverlay.classList.add("hidden");
      gestureHint.classList.remove("fade");
      setTimeout(() => gestureHint.classList.add("fade"), 5000);
    }

    function setPaused(value) {
      if (!isRunning) return;
      isPaused = value;
      pauseBtn.textContent = isPaused ? "▶️" : "⏸️";
      pauseOverlay.classList.toggle("hidden", !isPaused);
    }

    function togglePause() {
      setPaused(!isPaused);
    }

    function doJump() {
      if (!isRunning || isPaused || startCountdown > 0) return;
      if (player.isSliding) setSlide(false);

      if (player.jumpCount < player.maxJumps) {
        player.vy = player.jumpCount === 0 ? -14.2 : -12.6;
        player.jumpCount++;
        sfx(player.jumpCount === 1 ? "jump" : "doubleJump");
        spawnParticles(player.x + player.w / 2, player.y + player.h, getPokePartner().color, 14);
      }
    }

    function setSlide(sliding) {
      if (!isRunning || isPaused || startCountdown > 0) return;
      if (sliding && !player.isSliding) {
        player.isSliding = true;
        player.h = 30;
        player.y += 22;
        if (player.y + player.h < GROUND_Y) {
          player.vy = 12;
        }
      } else if (!sliding && player.isSliding) {
        player.isSliding = false;
        player.y -= 22;
        player.h = 52;
      }
    }

    function doDash() {
      if (!isRunning || isPaused || startCountdown > 0) return;
      if (player.dashCooldown <= 0 && player.dashTimer <= 0) {
        player.dashTimer = 18;
        player.dashCooldown = 90;
        player.vy = 0;
        sfx("dash");
        spawnParticles(player.x, player.y + player.h / 2, "#ec4899", 18);
      }
    }

    function spawnWorldEntities() {
      if (frameCount % 95 === 0 && Math.random() < 0.65) {
        const pw = 130 + Math.random() * 80;
        const py = GROUND_Y - (105 + Math.random() * 65);
        platforms.push({ x: canvas.width + 40, y: py, w: pw, h: 16 });

        for (let i = 0; i < 4; i++) {
          coins.push({ x: canvas.width + 60 + i * 32, y: py - 32, r: 11 });
        }
      }

      if (frameCount % 75 === 0) {
        const arcY = Math.random() < 0.5 ? GROUND_Y - 30 : GROUND_Y - 110;
        for (let i = 0; i < 5; i++) {
          coins.push({
            x: canvas.width + 30 + i * 30,
            y: arcY - Math.sin((i / 4) * Math.PI) * 35,
            r: 11
          });
        }
      }

      const spawnInterval = Math.max(48, Math.floor(95 - speed * 2.5));
      if (frameCount % spawnInterval === 0) {
        const roll = Math.random();
        if (roll < 0.45) {
          obstacles.push({ type: "spike", x: canvas.width + 20, y: GROUND_Y - 46, w: 36, h: 46 });
        } else if (roll < 0.78) {
          obstacles.push({ type: "drone", x: canvas.width + 20, y: GROUND_Y - 82, w: 48, h: 34 });
        } else {
          obstacles.push({ type: "wall", x: canvas.width + 20, y: GROUND_Y - 68, w: 42, h: 68 });
        }
      }

      if (frameCount % 310 === 0) {
        const types = ["shield", "magnet", "jetpack"];
        const chosen = types[Math.floor(Math.random() * types.length)];
        powerups.push({ type: chosen, x: canvas.width + 30, y: GROUND_Y - 125, w: 34, h: 34 });
      }
    }

    function rectIntersect(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    let lastBuffHTML = "";
    function updateBuffUI() {
      const tags = [];
      if (player.shield) tags.push(`<span class="buff-tag">🛡️ 護盾</span>`);
      if (player.magnetTimer > 0) tags.push(`<span class="buff-tag">🧲 ${Math.ceil(player.magnetTimer / 60)}s</span>`);
      if (player.jetpackTimer > 0) tags.push(`<span class="buff-tag">🚀 ${Math.ceil(player.jetpackTimer / 60)}s</span>`);
      const html = tags.join("");
      if (html !== lastBuffHTML) {
        buffBar.innerHTML = html;
        lastBuffHTML = html;
      }
      // Dash cooldown shown directly on the dash button
      btnDash.style.setProperty("--cd", (player.dashCooldown / 90).toFixed(2));
    }

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1300);
    }

    function updateGame() {
      frameCount++;
      const effectiveSpeed = player.jetpackTimer > 0 ? speed * 1.85 : player.dashTimer > 0 ? speed * 1.6 : speed;
      distance += effectiveSpeed * 0.08;
      speed = Math.min(13.5, 6.5 + distance * 0.0045);

      scoreText.textContent = Math.floor(distance);
      if (distance >= nextMilestone) {
        showToast(`🎉 ${nextMilestone} 公尺！加速中`);
        sfx("powerup");
        nextMilestone += 250;
      }

      if (player.dashTimer > 0) player.dashTimer--;
      if (player.dashCooldown > 0) player.dashCooldown--;
      if (player.magnetTimer > 0) player.magnetTimer--;
      if (player.jetpackTimer > 0) player.jetpackTimer--;

      const prevBottom = player.y + player.h;
      if (player.jetpackTimer > 0) {
        player.y += (110 - player.y) * 0.12;
        player.vy = 0;
        spawnParticles(player.x, player.y + player.h / 2, "#f59e0b", 2);
      } else if (player.dashTimer > 0) {
        player.vy = 0;
        spawnParticles(player.x, player.y + player.h / 2, "#ec4899", 2);
      } else {
        player.vy += player.gravity;
        player.y += player.vy;
      }

      let landed = false;
      platforms.forEach((p) => {
        if (
          player.vy >= 0 &&
          player.x + player.w > p.x + 6 &&
          player.x < p.x + p.w - 6 &&
          prevBottom <= p.y + 10 &&
          player.y + player.h >= p.y
        ) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.jumpCount = 0;
          landed = true;
        }
      });

      if (!landed && player.y + player.h >= GROUND_Y) {
        player.y = GROUND_Y - player.h;
        player.vy = 0;
        player.jumpCount = 0;
      }

      spawnWorldEntities();

      bgBuildings.forEach((b) => {
        b.x -= effectiveSpeed * (b.layer === 1 ? 0.25 : 0.45);
        if (b.x + b.w < 0) {
          b.x = canvas.width + 20;
          b.h = 90 + Math.random() * 170;
        }
      });

      platforms.forEach((p) => (p.x -= effectiveSpeed));
      platforms = platforms.filter((p) => p.x + p.w > -20);

      coins.forEach((c) => {
        c.x -= effectiveSpeed;
        if (player.magnetTimer > 0) {
          const dx = player.x + player.w / 2 - c.x;
          const dy = player.y + player.h / 2 - c.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 260) {
            c.x += (dx / dist) * 11;
            c.y += (dy / dist) * 11;
          }
        }
      });

      coins = coins.filter((c) => {
        const hit =
          c.x + c.r > player.x &&
          c.x - c.r < player.x + player.w &&
          c.y + c.r > player.y &&
          c.y - c.r < player.y + player.h;
        if (hit) {
          totalCoins++;
          localStorage.setItem("neonRunnerCoins", totalCoins);
          coinsText.textContent = totalCoins;
          sfx("coin");
          spawnParticles(c.x, c.y, "#fbbf24", 6);
          ballsThisRun++;
          popups.push({ x: c.x, y: c.y - 10, text: "+1", color: "#fecaca", life: 40 });
          return false;
        }
        return c.x > -30;
      });

      powerups.forEach((pw) => (pw.x -= effectiveSpeed));
      powerups = powerups.filter((pw) => {
        if (rectIntersect(player, pw)) {
          sfx("powerup");
          spawnParticles(pw.x, pw.y, "#38bdf8", 16);
          if (pw.type === "shield") player.shield = true;
          if (pw.type === "magnet") player.magnetTimer = 420;
          if (pw.type === "jetpack") player.jetpackTimer = 260;
          return false;
        }
        return pw.x > -40;
      });

      obstacles.forEach((ob) => (ob.x -= effectiveSpeed));
      obstacles = obstacles.filter((ob) => {
        const hitbox = { x: player.x + 6, y: player.y + 5, w: player.w - 12, h: player.h - 10 };
        if (rectIntersect(hitbox, ob)) {
          if (player.jetpackTimer > 0 || player.dashTimer > 0) {
            sfx("shieldBreak");
            spawnParticles(ob.x + ob.w / 2, ob.y + ob.h / 2, "#f43f5e", 18);
            return false;
          } else if (player.shield) {
            player.shield = false;
            shakeFrames = 12;
            sfx("shieldBreak");
            spawnParticles(ob.x + ob.w / 2, ob.y + ob.h / 2, "#38bdf8", 22);
            return false;
          } else {
            triggerGameOver();
            return false;
          }
        }
        return ob.x + ob.w > -40;
      });

      particles.forEach((pt) => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= 0.03;
      });
      particles = particles.filter((pt) => pt.alpha > 0);

      if (frameCount % 6 === 0) updateBuffUI();
    }

    function triggerGameOver() {
      isRunning = false;
      sfx("hit");
      shakeFrames = 18;
      const runDist = Math.floor(distance);
      const isNewRecord = runDist > bestScore;
      if (isNewRecord) {
        bestScore = runDist;
        localStorage.setItem("neonRunnerBest", bestScore);
      }
      updateHUD();
      renderSkinShop();
      const who =
        currentSkinId === "hero1"
          ? "Alfie"
          : currentSkinId === "hero2"
          ? "Darren"
          : "Alfie & Darren";
      overlayTitle.textContent = `🚴‍♂️ ${who} 騎了 ${runDist} 公尺！`;
      overlayDesc.innerHTML = `
        ${isNewRecord ? '<div class="new-record">🏆 新紀錄！</div>' : ""}
        <div class="stats-row">
          <div class="stat-box"><b>${runDist}</b><span>本局距離 (m)</span></div>
          <div class="stat-box"><b>${bestScore}</b><span>最高紀錄 (m)</span></div>
          <div class="stat-box"><b>${ballsThisRun}</b><span>精靈球</span></div>
        </div>
        換個小騎士或夥伴，再挑戰一次！`;
      startBtn.textContent = "🔄 再騎一局";
      setTimeout(() => menuOverlay.classList.remove("hidden"), 450);
    }

    function drawGame() {
      ctx.save();
      if (shakeFrames > 0) {
        shakeFrames--;
        ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
      }

      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "#060a1a");
      grad.addColorStop(0.55, "#1e1b4b");
      grad.addColorStop(1, "#3b0764");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Twinkling stars
      stars.forEach((st) => {
        if (st.x > canvas.width) return;
        ctx.globalAlpha = 0.45 + Math.sin(frameCount * 0.05 + st.tw) * 0.35;
        ctx.fillStyle = "#e0f2fe";
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Glowing moon
      ctx.save();
      ctx.shadowColor = "#fde68a";
      ctx.shadowBlur = 40;
      ctx.fillStyle = "#fef3c7";
      ctx.beginPath();
      ctx.arc(canvas.width - 90, 80, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // City skyline with lit windows
      bgBuildings.forEach((b) => {
        const far = b.layer === 1;
        ctx.fillStyle = far ? "rgba(30, 27, 75, 0.85)" : "rgba(17, 24, 39, 0.95)";
        ctx.fillRect(b.x, GROUND_Y - b.h, b.w, b.h);
        ctx.fillStyle = far ? "rgba(167, 139, 250, 0.35)" : "rgba(253, 224, 71, 0.55)";
        for (let wy = GROUND_Y - b.h + 10; wy < GROUND_Y - 12; wy += 16) {
          for (let wx = b.x + 7; wx < b.x + b.w - 8; wx += 12) {
            if (((wx * 7 + wy * 13) | 0) % 5 < 2) ctx.fillRect(wx, wy, 5, 7);
          }
        }
      });

      // Ground
      const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, canvas.height);
      groundGrad.addColorStop(0, "#1e1b4b");
      groundGrad.addColorStop(1, "#0b1020");
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
      ctx.save();
      ctx.shadowColor = "#22d3ee";
      ctx.shadowBlur = 12;
      ctx.strokeStyle = "#22d3ee";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();
      ctx.restore();

      ctx.strokeStyle = "rgba(6, 182, 212, 0.25)";
      ctx.lineWidth = 1.5;
      const offset = (frameCount * speed) % 50;
      for (let x = -offset; x < canvas.width; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y);
        ctx.lineTo(x - 35, canvas.height);
        ctx.stroke();
      }

      platforms.forEach((p) => {
        ctx.fillStyle = "#1e293b";
        ctx.strokeStyle = "#a855f7";
        ctx.lineWidth = 2.5;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeRect(p.x, p.y, p.w, p.h);
      });

      // Draw Pokéball Collectibles
      coins.forEach((c) => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(frameCount * 0.06);
        // Bottom white half
        ctx.beginPath();
        ctx.arc(0, 0, c.r, 0, Math.PI * 2);
        ctx.fillStyle = "#f8fafc";
        ctx.fill();
        // Top red half
        ctx.beginPath();
        ctx.arc(0, 0, c.r, Math.PI, 0);
        ctx.fillStyle = "#ef4444";
        ctx.fill();
        // Center black belt & outer rim
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(0, 0, c.r, 0, Math.PI * 2);
        ctx.moveTo(-c.r, 0);
        ctx.lineTo(c.r, 0);
        ctx.stroke();
        // Center button
        ctx.beginPath();
        ctx.arc(0, 0, 3.6, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      function drawPokeCompanion(px, py, pokeId) {
        const hover = Math.sin(frameCount * 0.22) * 3.5;
        ctx.save();
        ctx.translate(px, py + hover);

        if (pokeId === "pika") {
          // ⚡ Electric Yellow Mouse (Pika Style)
          // Lightning bolt tail
          ctx.fillStyle = "#facc15";
          ctx.strokeStyle = "#ca8a04";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-8, 4);
          ctx.lineTo(-16, -2);
          ctx.lineTo(-12, -5);
          ctx.lineTo(-21, -13);
          ctx.lineTo(-9, -8);
          ctx.lineTo(-12, -4);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Long ears with black tips
          const earBounce = Math.sin(frameCount * 0.3) * 0.12;
          [-5, 5].forEach((ex, idx) => {
            ctx.save();
            ctx.translate(ex, -10);
            ctx.rotate((idx === 0 ? -0.35 : 0.25) + earBounce);
            ctx.fillStyle = "#fde047";
            ctx.beginPath();
            ctx.ellipse(0, -6, 3.2, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#0f172a";
            ctx.beginPath();
            ctx.ellipse(0, -11, 2.4, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });

          // Round yellow body/head
          ctx.shadowColor = "#facc15";
          ctx.shadowBlur = 10;
          ctx.fillStyle = "#fde047";
          ctx.beginPath();
          ctx.arc(0, -2, 11, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Red electric cheeks
          ctx.fillStyle = "#ef4444";
          ctx.beginPath();
          ctx.arc(-6, 1, 3, 0, Math.PI * 2);
          ctx.arc(7, 1, 3, 0, Math.PI * 2);
          ctx.fill();

          // Cute eyes
          ctx.fillStyle = "#0f172a";
          ctx.beginPath();
          ctx.arc(-3.5, -4, 2, 0, Math.PI * 2);
          ctx.arc(5.5, -4, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(-4, -4.7, 0.8, 0, Math.PI * 2);
          ctx.arc(5, -4.7, 0.8, 0, Math.PI * 2);
          ctx.fill();
        } else if (pokeId === "dragon") {
          // 🔥 Flame Dragon (Char Style)
          const wingFlap = Math.sin(frameCount * 0.35) * 6;
          // Wings
          ctx.fillStyle = "#0d9488";
          ctx.strokeStyle = "#f97316";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-4, -4);
          ctx.lineTo(-16, -16 + wingFlap);
          ctx.lineTo(-6, -12 + wingFlap * 0.5);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Tail with blazing flame
          ctx.strokeStyle = "#f97316";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(-6, 4);
          ctx.quadraticCurveTo(-18, 6, -19, -4);
          ctx.stroke();
          ctx.fillStyle = frameCount % 4 < 2 ? "#ef4444" : "#facc15";
          ctx.beginPath();
          ctx.arc(-19, -7, 4.5, 0, Math.PI * 2);
          ctx.fill();

          // Dragon Head & Body
          ctx.shadowColor = "#f97316";
          ctx.shadowBlur = 10;
          ctx.fillStyle = "#fb923c";
          ctx.beginPath();
          ctx.arc(0, -2, 11, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Cream belly
          ctx.fillStyle = "#fef08a";
          ctx.beginPath();
          ctx.arc(2, 2, 6.5, 0, Math.PI * 2);
          ctx.fill();

          // Fierce eyes
          ctx.fillStyle = "#0f172a";
          ctx.beginPath();
          ctx.arc(4, -5, 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (pokeId === "frog") {
          // 💧 Aqua Ninja Frog (Greninja Style)
          // Flowing pink scarf-tongue
          const wave = Math.sin(frameCount * 0.3) * 4;
          ctx.strokeStyle = "#f472b6";
          ctx.lineWidth = 4.5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(0, 1);
          ctx.quadraticCurveTo(-14, -4 + wave, -22, 2 - wave);
          ctx.stroke();

          // Blue ninja head
          ctx.shadowColor = "#06b6d4";
          ctx.shadowBlur = 10;
          ctx.fillStyle = "#0284c7";
          ctx.beginPath();
          ctx.arc(0, -3, 10.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Spinning Water Shuriken in front
          ctx.save();
          ctx.translate(14, -2);
          ctx.rotate(frameCount * 0.35);
          ctx.fillStyle = "#22d3ee";
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(0, -8);
            ctx.lineTo(2.5, 0);
            ctx.lineTo(-2.5, 0);
            ctx.closePath();
            ctx.fill();
            ctx.rotate(Math.PI / 2);
          }
          ctx.restore();
        } else {
          // ✨ Psychic Myth (Mew Style)
          const tailWave = Math.cos(frameCount * 0.2) * 5;
          ctx.strokeStyle = "#f472b6";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-6, 2);
          ctx.bezierCurveTo(-18, -10, -14, -22 + tailWave, -22, -18 + tailWave);
          ctx.stroke();

          // Psychic aura ring
          ctx.strokeStyle = "rgba(232, 121, 249, 0.7)";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(0, -2, 15, 0, Math.PI * 2);
          ctx.stroke();

          ctx.shadowColor = "#e879f9";
          ctx.shadowBlur = 12;
          ctx.fillStyle = "#f9a8d4";
          ctx.beginPath();
          ctx.arc(0, -2, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Big blue psychic eyes
          ctx.fillStyle = "#0284c7";
          ctx.beginPath();
          ctx.arc(4, -3, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      ctx.font = "24px 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      powerups.forEach((pw) => {
        ctx.fillStyle = "rgba(56, 189, 248, 0.22)";
        ctx.beginPath();
        ctx.arc(pw.x + pw.w / 2, pw.y + pw.h / 2, 22, 0, Math.PI * 2);
        ctx.fill();
        const icon = pw.type === "shield" ? "🛡️" : pw.type === "magnet" ? "🧲" : "🚀";
        ctx.fillText(icon, pw.x + pw.w / 2, pw.y + pw.h / 2);
      });

      obstacles.forEach((ob) => {
        if (ob.type === "spike") {
          ctx.fillStyle = "#ef4444";
          ctx.beginPath();
          ctx.moveTo(ob.x, ob.y + ob.h);
          ctx.lineTo(ob.x + ob.w / 2, ob.y);
          ctx.lineTo(ob.x + ob.w, ob.y + ob.h);
          ctx.closePath();
          ctx.fill();
        } else if (ob.type === "drone") {
          ctx.fillStyle = "#f43f5e";
          ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
          ctx.fillStyle = "#fff";
          ctx.fillText("🛸", ob.x + ob.w / 2, ob.y + ob.h / 2);
        } else {
          ctx.fillStyle = "#dc2626";
          ctx.strokeStyle = "#fca5a5";
          ctx.lineWidth = 2;
          ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
          ctx.strokeRect(ob.x, ob.y, ob.w, ob.h);
        }
      });

      function drawRider(rx, bottomY, whichHero, sliding, scale = 1) {
        const isHero1 = whichHero === 1;
        const img = isHero1 ? imgHero1 : imgHero2;
        const bikeColor = isHero1 ? "#ef4444" : "#34d399";
        const pantsColor = isHero1 ? "#2563eb" : "#1e293b";
        const wheelAngle = (frameCount * speed * 0.12) % (Math.PI * 2);

        ctx.save();
        ctx.translate(rx, bottomY);
        ctx.scale(scale, sliding ? scale * 0.68 : scale);

        if (currentSkinId === "photo" && img.complete && img.naturalWidth > 0) {
          // Full Photo Cutout Mode
          const sx = isHero1 ? 295 : 305;
          const sy = isHero1 ? 125 : 48;
          const sw = isHero1 ? 425 : 455;
          const sh = isHero1 ? 485 : 582;
          ctx.save();
          ctx.shadowColor = bikeColor;
          ctx.shadowBlur = 14;
          ctx.strokeStyle = bikeColor;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-30, -68, 62, 66, 12);
          ctx.stroke();
          ctx.clip();
          ctx.drawImage(img, sx, sy, sw, sh, -30, -68, 62, 66);
          ctx.restore();
          ctx.restore();
          return;
        }

        // 1. Rear & Front Bicycle Wheels
        const wheelPositions = [-16, 16];
        wheelPositions.forEach((wx) => {
          ctx.save();
          ctx.translate(wx, -10);
          ctx.rotate(wheelAngle);
          ctx.beginPath();
          ctx.arc(0, 0, 9.5, 0, Math.PI * 2);
          ctx.lineWidth = 3.2;
          ctx.strokeStyle = "#0f172a";
          ctx.stroke();
          ctx.lineWidth = 1.6;
          ctx.strokeStyle = "#cbd5e1";
          ctx.stroke();
          // Spokes
          for (let s = 0; s < 4; s++) {
            ctx.beginPath();
            ctx.moveTo(-8, 0);
            ctx.lineTo(8, 0);
            ctx.stroke();
            ctx.rotate(Math.PI / 4);
          }
          ctx.restore();
        });

        // 2. Bicycle Frame (B'TWIN Red or Mint-Green)
        ctx.strokeStyle = bikeColor;
        ctx.lineWidth = 3.5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(-16, -10); // Rear axle
        ctx.lineTo(-2, -10);  // Crank
        ctx.lineTo(11, -24);  // Handlebar stem
        ctx.lineTo(-7, -23);  // Seat post top
        ctx.closePath();
        ctx.stroke();

        // Front fork & handlebar
        ctx.beginPath();
        ctx.moveTo(16, -10);
        ctx.lineTo(10, -29);
        ctx.lineTo(14, -30);
        ctx.stroke();

        // 3. Rider Legs & Patterned White Sweatshirt Torso
        const pedalOffset = Math.sin(wheelAngle * 2) * 3.5;
        ctx.strokeStyle = pantsColor;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-7, -24);
        ctx.lineTo(2, -16 + pedalOffset);
        ctx.lineTo(-1, -8 + pedalOffset);
        ctx.stroke();

        // White patterned top
        ctx.strokeStyle = "#f8fafc";
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(-7, -25);
        ctx.lineTo(2, -39);
        ctx.stroke();

        // Arms holding handlebar
        ctx.strokeStyle = "#f1f5f9";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(2, -37);
        ctx.lineTo(11, -29);
        ctx.stroke();

        // 4. Real Cropped Photo Head in Glowing Circle!
        const bob = Math.sin(frameCount * 0.25) * 1.5;
        const headX = 3;
        const headY = -54 + bob;
        const headR = 19;

        ctx.save();
        ctx.beginPath();
        ctx.arc(headX, headY, headR, 0, Math.PI * 2);
        ctx.shadowColor = bikeColor;
        ctx.shadowBlur = 12;
        ctx.fillStyle = "#1e293b";
        ctx.fill();
        ctx.lineWidth = 2.8;
        ctx.strokeStyle = bikeColor;
        ctx.stroke();
        ctx.clip();

        if (img.complete && img.naturalWidth > 0) {
          if (isHero1) {
            ctx.drawImage(img, 438, 125, 130, 130, headX - headR, headY - headR, headR * 2, headR * 2);
          } else {
            ctx.drawImage(img, 445, 48, 150, 150, headX - headR, headY - headR, headR * 2, headR * 2);
          }
        }
        ctx.restore();

        // 4b. Cute Pokémon Trainer Cap on top of head!
        ctx.save();
        ctx.translate(headX, headY - headR + 2);
        // Red crown
        ctx.fillStyle = isHero1 ? "#ef4444" : "#10b981";
        ctx.beginPath();
        ctx.arc(0, 0, 13, Math.PI, 0);
        ctx.fill();
        // White front emblem semicircle
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(3, -1, 5.5, Math.PI, 0);
        ctx.fill();
        // Cap visor pointing right
        ctx.fillStyle = "#f8fafc";
        ctx.beginPath();
        ctx.ellipse(9, 0, 9, 2.8, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 5. Floating Name Badge (Alfie / Darren)
        const riderName = isHero1 ? "Alfie" : "Darren";
        ctx.save();
        ctx.font = "bold 11px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.strokeStyle = bikeColor;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(headX - 22, headY - headR - 23, 44, 14, 7);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.fillText(riderName, headX, headY - headR - 16);
        ctx.restore();

        // 6. Pokémon-Style Companion beside the bike!
        const partnerToDraw =
          currentSkinId === "duo" && !isHero1
            ? currentPokeId === "pika"
              ? "dragon"
              : "pika"
            : currentPokeId;
        drawPokeCompanion(26, -34, partnerToDraw);

        ctx.restore();
      }

      // Draw Player(s)
      const centerX = player.x + player.w / 2;
      const bottomY = player.y + player.h;

      if (currentSkinId === "duo") {
        // Draw Brother 2 following right behind Brother 1!
        const companionJumpOffset = (GROUND_Y - bottomY) * 0.85;
        drawRider(centerX - 48, GROUND_Y - companionJumpOffset, 2, player.isSliding, 0.92);
        drawRider(centerX + 4, bottomY, 1, player.isSliding, 1.0);
      } else if (currentSkinId === "hero2") {
        drawRider(centerX, bottomY, 2, player.isSliding, 1.05);
      } else {
        drawRider(centerX, bottomY, 1, player.isSliding, 1.05);
      }

      if (player.shield) {
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x + player.w / 2, player.y + player.h / 2 - 8, 42, 0, Math.PI * 2);
        ctx.stroke();
      }

      particles.forEach((pt) => {
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
      });
      ctx.globalAlpha = 1;

      // Floating "+1" popups
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 16px 'Segoe UI', sans-serif";
      popups.forEach((pp) => {
        ctx.globalAlpha = Math.max(0, pp.life / 40);
        ctx.fillStyle = pp.color;
        ctx.fillText(pp.text, pp.x, pp.y);
      });
      ctx.globalAlpha = 1;

      // 3-2-1 GO countdown
      if (isRunning && startCountdown > 0) {
        const n = Math.ceil(startCountdown / 50) - 1;
        const label = n > 0 ? String(n) : "GO!";
        const t = (startCountdown % 50) / 50;
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height * 0.42);
        ctx.scale(1 + t * 0.5, 1 + t * 0.5);
        ctx.globalAlpha = Math.min(1, t * 2 + 0.2);
        ctx.font = "900 72px 'Segoe UI', sans-serif";
        ctx.shadowColor = n > 0 ? "#22d3ee" : "#facc15";
        ctx.shadowBlur = 30;
        ctx.fillStyle = n > 0 ? "#e0f2fe" : "#fde047";
        ctx.fillText(label, 0, 0);
        ctx.restore();
      }

      ctx.restore();
    }

    function loop() {
      if (isRunning && !isPaused) {
        if (startCountdown > 0) {
          startCountdown--;
          if (startCountdown % 50 === 49) sfx(startCountdown < 50 ? "powerup" : "coin");
        } else {
          updateGame();
        }
      }
      popups.forEach((pp) => {
        pp.y -= 0.8;
        pp.life--;
      });
      popups = popups.filter((pp) => pp.life > 0);
      drawGame();
      requestAnimationFrame(loop);
    }

    // ====== Keyboard Bindings ======
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        e.preventDefault();
        if (!isRunning) resetGame();
        else doJump();
      } else if (e.code === "ArrowDown" || e.code === "KeyS") {
        e.preventDefault();
        setSlide(true);
      } else if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyD") {
        e.preventDefault();
        doDash();
      } else if (e.code === "KeyP" || e.code === "Escape") {
        togglePause();
      } else if (e.code === "Enter" && !isRunning) {
        resetGame();
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowDown" || e.code === "KeyS") setSlide(false);
    });

    // ====== Mobile Thumb Buttons ======
    const btnJump = document.getElementById("btnJump");
    const btnSlide = document.getElementById("btnSlide");
    const btnDash = document.getElementById("btnDash");

    btnJump.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      doJump();
    });
    btnSlide.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      setSlide(true);
    });
    btnSlide.addEventListener("pointerup", () => setSlide(false));
    btnSlide.addEventListener("pointercancel", () => setSlide(false));
    btnSlide.addEventListener("pointerleave", () => setSlide(false));
    btnDash.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      doDash();
    });

    // ====== Touch Swipe Gestures on Canvas ======
    const touchZone = document.getElementById("touchZone");
    let touchStartX = 0;
    let touchStartY = 0;
    let swiped = false;

    touchZone.addEventListener("touchstart", (e) => {
      if (!isRunning || isPaused || startCountdown > 0) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      swiped = false;
    }, { passive: true });

    touchZone.addEventListener("touchmove", (e) => {
      if (!isRunning || isPaused || swiped) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;
      if (dy > 35 && Math.abs(dy) > Math.abs(dx)) {
        swiped = true;
        setSlide(true);
        setTimeout(() => setSlide(false), 550);
      } else if (dx > 40 && Math.abs(dx) > Math.abs(dy)) {
        swiped = true;
        doDash();
      }
    }, { passive: true });

    touchZone.addEventListener("touchend", (e) => {
      // Ignore taps on HUD buttons / overlays so they don't trigger a jump
      if (e.target.closest && e.target.closest("button, .overlay")) return;
      if (!isRunning || isPaused || startCountdown > 0) return;
      if (!swiped) {
        doJump();
      }
    }, { passive: true });

    // ====== UI Buttons ======
    startBtn.addEventListener("click", resetGame);
    pauseBtn.addEventListener("click", togglePause);
    document.getElementById("resumeBtn").addEventListener("click", () => setPaused(false));
    document.getElementById("quitBtn").addEventListener("click", () => {
      pauseOverlay.classList.add("hidden");
      isPaused = false;
      isRunning = false;
      pauseBtn.textContent = "⏸️";
      startBtn.textContent = "▶ 開始騎車";
      menuOverlay.classList.remove("hidden");
    });
    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? "🔊" : "🔇";
    });

    qrOpenBtn.addEventListener("click", () => {
      isPaused = true;
      const currentUrl = window.location.protocol.startsWith("http")
        ? window.location.href
        : "https://hsienstyle.github.io/neon-runner-game/";
      document.getElementById("lanUrlText").textContent = currentUrl;
      document.getElementById("qrImg").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" +
        encodeURIComponent(currentUrl);
      qrOverlay.classList.remove("hidden");
    });
    qrCloseBtn.addEventListener("click", () => {
      qrOverlay.classList.add("hidden");
      isPaused = false;
    });

    updateHUD();
    renderSkinShop();
    loop();
  </script>
</body>
</html>
